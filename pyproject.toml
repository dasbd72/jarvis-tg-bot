[project]
name = "jarvis-tg-bot"
version = "0.1.0"
description = "Control your PC with Jarvis Telegram Bot."
readme = "README.md"
authors = [
    { name = "dasbd72", email = "twbd723@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
jarvis-tg-bot = "jarvis_tg_bot:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis_tg_bot"]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
]
